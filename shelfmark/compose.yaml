services:
  shelfmark:
    container_name: shelfmark
    image: ghcr.io/calibrain/shelfmark:v1.3.6@sha256:22688cce89c0d5eca8be6f371cff6b0326fdee5540cd4992faa451d133e76989
    environment:
      UID: ${UID}
      GID: ${GID}
      FLASK_PORT: 8084
      FLASK_DEBUG: false
      USE_BOOK_TITLE: true
      BOOK_LANGUAGE: nl
      USE_CF_BYPASS: true
    restart: unless-stopped
    volumes:
      - ${MEDIA_DIR}/downloads/usenet/books:/books
      - ${DOCKER_DATA_DIR}/shelfmark/config:/config
    networks:
      - npm
    labels:
      - traefik.enable=true
      - traefik.http.routers.shelfmark.rule=Host(`shelfmark.${DOMAIN}`)
      - traefik.http.routers.shelfmark.entrypoints=websecure
      - traefik.http.routers.shelfmark.tls=true
      - traefik.http.services.shelfmark.loadbalancer.server.port=8084
networks:
  npm:
    external: true
