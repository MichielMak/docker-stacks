services:
  homepage:
    image: docker.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
    container_name: homepage
    volumes:
      - ${DOCKER_DATA_DIR}/homepage/config:/app/config
      # Versioned in git; overrides the file in the host config folder.
      - ./config/docker.yaml:/app/config/docker.yaml:ro
    depends_on:
      - homepage-dockerproxy
    networks:
      - npm
      - homepage-internal
    restart: unless-stopped
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.docker.network=npm
      - traefik.http.routers.homepage.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls=true
      - traefik.http.routers.homepage.middlewares=authentik-forwardauth@docker
      - traefik.http.services.homepage.loadbalancer.server.port=3000

  homepage-dockerproxy:
    image: linuxserver/socket-proxy:3.4.6@sha256:362cadf55b3c7920189347d0f4d60b389e2f80e929581bf10793f2371aab41e5
    container_name: homepage-dockerproxy
    # Homepage reads container status, stats and homepage.* labels.
    environment:
      - CONTAINERS=1
      - POST=0 # read-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - homepage-internal
    read_only: true
    tmpfs:
      - /run

networks:
  npm:
    external: true
  # No internet or LAN access; only homepage can reach the socket proxy.
  homepage-internal:
    driver: bridge
    internal: true
