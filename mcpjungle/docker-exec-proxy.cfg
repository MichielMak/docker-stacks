# HAProxy template for mcpjungle-docker-exec-proxy.
#
# Mounted over /templates/haproxy.cfg of the linuxserver/socket-proxy image.
# The image's entrypoint only substitutes @@BIND_PROTO@@ and starts haproxy, so
# this file replaces the env-driven allow-list with a fixed one.
#
# Why not just set EXEC=1 on the stock template: exec needs POST, and POST=1
# combined with CONTAINERS=1 (needed to list containers) also permits container
# create, remove, rename and update. This template allows exactly what
# container-exec-mcp calls and nothing else.
#
# Keep the global/defaults sections in sync with the upstream template when
# Renovate bumps the image:
# https://github.com/linuxserver/docker-socket-proxy/blob/main/root/templates/haproxy.cfg

global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 2000
    user root
    chroot /

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 2000

backend docker
    server socket $SOCKET_PATH

frontend proxy
    bind @@BIND_PROTO@@

    # Health / version negotiation
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/(_ping|version)$ }
    # list_containers
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/json$ }
    # get_container_info, and the running check before every exec
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/json$ }
    # exec: create the exec instance, start it, read its exit code
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/exec$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/exec/[a-zA-Z0-9]+/start$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/exec/[a-zA-Z0-9]+/json$ }

    http-request deny

    default_backend docker
