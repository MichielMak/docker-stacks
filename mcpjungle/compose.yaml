# MCPJungle - self-hosted MCP server registry & gateway
#
# Required per-stack env vars (set in Komodo):
#   MCPJUNGLE_DB_PASSWORD    database password
#
# NOTE: avoid "$" in this value. Compose interpolates the env file, so a
# literal "$" is read as a variable reference. Use hex/alphanumeric values.
#
# SERVER_MODE:
#   development - web UI is served, mcpjungle itself does NO authentication.
#   enterprise  - per-client bearer tokens + ACLs, but the web UI returns 404
#                 (upstream serves the frontend in dev mode only).
# This stack runs "development" and puts Authentik in front of the UI instead,
# same pattern as sonarr. See the router split below for what that does and
# does not cover.

#
# Docker MCP server + socket proxy
# --------------------------------
# mcp-server-docker talks to the Docker API directly, so it sees every
# container on the host.
#
# mcp-server-docker (https://pypi.org/project/mcp-server-docker/) is a stdio
# Python package and publishes no Docker image. The mcpjungle "-stdio" image
# already ships uv/uvx and Python, so mcpjungle can run the package straight
# from PyPI as a child process.
#
# The Docker socket is deliberately NOT mounted into mcpjungle. MCPJungle runs
# whatever MCP servers are defined in its database, so giving it the raw socket
# would be root-equivalent access to the host. Instead the socket goes to the
# mcpjungle-docker-proxy service below, which enforces an allow-list, and
# mcpjungle reaches it over the internal network on tcp://...:2375.
#
# After the stack is up, register the server yourself in the MCPJungle web UI
# (it is stored in mcpjungle's Postgres DB - compose cannot declare it):
#   Transport: stdio
#   Command:   uvx
#   Arguments: mcp-server-docker@0.3.0
#   Environment variables:
#     DOCKER_HOST=tcp://mcpjungle-docker-proxy:2375
#
# NOTE: mcp-server-docker also exposes create/remove tools. The proxy
# refuses those requests, so calling them returns an error. That is by design -
# this server is for inspecting containers plus start/stop/restart, nothing more.

services:
  mcpjungle-docker-proxy:
    image: linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    container_name: mcpjungle-docker-proxy
    environment:
      # Read access - what the Docker MCP server needs to inspect the host.
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - VERSION=1
      - PING=1
      - EVENTS=1
      - ALLOW_LOGS=1
      - ALLOW_TOP=1
      # Write access - start/stop/restart only.
      #
      # POST=0 denies every non-GET request that is not explicitly allowed
      # above it, so create, remove, rename and exec are refused even though
      # mcp-server-docker offers tools for them. This works because this image
      # evaluates the ALLOW_* container rules BEFORE the POST check; the
      # upstream Tecnativa image checks POST first, where POST=1 plus
      # CONTAINERS=1 would also permit create and remove.
      - POST=0
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      # Explicitly denied.
      - EXEC=0
      - AUTH=0
      - SECRETS=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - ALLOW_ARCHIVE=0
      - ALLOW_CHANGES=0
      - ALLOW_EXPORT=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Internal network only - never published, no Traefik labels. This must not
    # be reachable from anywhere except mcpjungle.
    networks:
      - mcpjungle-internal
    restart: unless-stopped

  mcpjungle:
    image: docker.io/mcpjungle/mcpjungle:0.4.6-stdio@sha256:4b647cc6e8134cb95c251d59a352c9a21cca4a7df62f63c7352a37b4b4cc1514
    container_name: mcpjungle
    environment:
      - DATABASE_URL=postgres://mcpjungle:${MCPJUNGLE_DB_PASSWORD}@mcpjungle-db:5432/mcpjungle
      - SERVER_MODE=development
      - OTEL_ENABLED=false
      # The first uvx run of a stdio server downloads the package before the
      # server can answer the MCP initialize request, which can take longer
      # than the 10s default.
      - MCP_SERVER_INIT_REQ_TIMEOUT_SEC=120
      # Persistent uv cache so uvx-based stdio MCP servers start fast instead
      # of re-downloading their package on every session.
      - UV_CACHE_DIR=/opt/uv-cache
    volumes:
      # Read-only host data exposed to filesystem-type MCP servers
      - ${DOCKER_DATA_DIR}/mcpjungle/host:/host:ro
      # Writable uv package cache (see UV_CACHE_DIR above)
      - mcpjungle-uv-cache:/opt/uv-cache
    depends_on:
      mcpjungle-db:
        condition: service_healthy
    labels:
      - homepage.group=Infra
      - homepage.name=MCPJungle
      - homepage.icon=mcp.png
      - homepage.href=https://mcpjungle.${DOMAIN}/
      - homepage.description=MCP server registry and gateway
      - traefik.enable=true
      - traefik.docker.network=npm
      # Machine paths: MCP proxy transports, CLI API, health. These must skip
      # Authentik - MCP clients and the mcpjungle CLI send their own bearer
      # token and cannot follow an OIDC browser redirect.
      #
      # Because they skip Authentik and mcpjungle itself does no auth
      # (SERVER_MODE=development), they are limited to LAN clients. Traffic from
      # the Cloudflare tunnel, tsbridge and other containers reaches Traefik as
      # the npm network gateway (172.16.2.1), so it is blocked here. Containers
      # on the npm network (e.g. paseo) should use http://mcpjungle:8080/mcp
      # directly instead.
      - traefik.http.routers.mcpjungle-api.rule=Host(`mcpjungle.${DOMAIN}`) && (PathPrefix(`/mcp`) || PathPrefix(`/sse`) || PathPrefix(`/message`) || PathPrefix(`/api/v0`) || PathPrefix(`/v0`) || PathPrefix(`/health`) || PathPrefix(`/metadata`))
      - traefik.http.routers.mcpjungle-api.entrypoints=websecure
      - traefik.http.routers.mcpjungle-api.priority=100
      - traefik.http.routers.mcpjungle-api.tls=true
      - traefik.http.routers.mcpjungle-api.service=mcpjungle
      - traefik.http.routers.mcpjungle-api.middlewares=mcpjungle-lan-only
      - traefik.http.middlewares.mcpjungle-lan-only.ipallowlist.sourcerange=192.168.178.0/24
      # Everything else - web UI, /assets, /api/dashboard, /init - behind Authentik
      - traefik.http.routers.mcpjungle.rule=Host(`mcpjungle.${DOMAIN}`)
      - traefik.http.routers.mcpjungle.entrypoints=websecure
      - traefik.http.routers.mcpjungle.priority=99
      - traefik.http.routers.mcpjungle.tls=true
      - traefik.http.routers.mcpjungle.middlewares=authentik-forwardauth@docker
      - traefik.http.routers.mcpjungle.service=mcpjungle
      - traefik.http.services.mcpjungle.loadbalancer.server.port=8080
    networks:
      - default
      - mcpjungle-internal
    restart: unless-stopped

  mcpjungle-db:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: mcpjungle-db
    environment:
      - POSTGRES_USER=mcpjungle
      - POSTGRES_PASSWORD=${MCPJUNGLE_DB_PASSWORD}
      - POSTGRES_DB=mcpjungle
    volumes:
      - ${DOCKER_DATA_DIR}/mcpjungle/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpjungle"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcpjungle-internal
    restart: unless-stopped

volumes:
  mcpjungle-uv-cache:

networks:
  default:
    external: true
    name: npm
  mcpjungle-internal:
    driver: bridge
