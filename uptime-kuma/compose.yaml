services:
  uptime-kuma:
    restart: unless-stopped
    #    ports:
    #      - 3001:3001
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ${DOCKER_DATA_DIR}/uptime-kuma/config:/app/data
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2.5.11@sha256:7554dba313c84e44fee921ef3b5626ba1c711e412e82815e8c957517026112a9
    depends_on:
      - uptime-kuma-dockerproxy
    networks:
      - npm
      - uptime-kuma-internal
    labels:
      - homepage.group=Infra
      - homepage.name=Uptime Kuma
      - homepage.icon=uptime-kuma.png
      - homepage.href=http://uptime.${DOMAIN}/
      - homepage.description=A fancy self-hosted monitoring tool
      - homepage.widget.type=uptimekuma
      - homepage.widget.url=http://uptime-kuma:3001
      - homepage.widget.slug=public
      - traefik.enable=true
      - traefik.docker.network=npm
      - traefik.http.routers.uptime.rule=Host(`uptime.${DOMAIN}`)
      - traefik.http.routers.uptime.entrypoints=websecure
      - traefik.http.routers.uptime.tls=true
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  uptime-kuma-dockerproxy:
    image: linuxserver/socket-proxy:3.4.7@sha256:823dda971e9a3951257eb251586a804199819fe1587c35faa43adc7b52a2ff16
    container_name: uptime-kuma-dockerproxy
    # Docker container monitors inspect containers; INFO is for the "Test" button on the Docker host.
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0 # read-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - uptime-kuma-internal
    read_only: true
    tmpfs:
      - /run

networks:
  npm:
    external: true
  # No internet or LAN access; only uptime-kuma can reach the socket proxy.
  uptime-kuma-internal:
    driver: bridge
    internal: true
