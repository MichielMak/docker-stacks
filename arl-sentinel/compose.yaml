services:
  arl-sentinel:
    image: python:3.15-slim@sha256:ea4f1f290e071bf7d28199cfb3e09f5dbad31b50e9c32fd58f2f2d7be915f3ae
    container_name: arl-sentinel
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python sentinel.py"
    environment:
      - TZ=Europe/Amsterdam
      # Without this, print() output is buffered and never shows in the logs.
      - PYTHONUNBUFFERED=1
      - CHECK_INTERVAL_SECONDS=21600
      - GOTIFY_URL=http://gotify
      - GOTIFY_TOKEN=${ARL_SENTINEL_GOTIFY_TOKEN}
      - DOCKERPROXY_URL=http://arl-dockerproxy:2375
      - ATTEMPT_AUTO_LOGIN=true
      - DEEZER_EMAIL=${DEEZER_EMAIL}
      - DEEZER_PASSWORD=${DEEZER_PASSWORD}
      # Music Assistant target: create a long-lived token in
      # Settings -> your user -> Long-lived tokens. Leave empty to skip.
      - MUSICASSISTANT_URL=http://musicassistant:8095
      - MUSICASSISTANT_TOKEN=${MUSICASSISTANT_TOKEN}
    volumes:
      # Code comes from this repo, so changes deploy with the stack.
      - ./app:/app:ro
      - ${DOCKER_DATA_DIR}/arl-sentinel/data:/data
      - ${DOCKER_DATA_DIR}/arl-sentinel/inbox:/inbox
      - ${DOCKER_DATA_DIR}/deemix/config:/targets/deemix
      - ${DOCKER_DATA_DIR}/spotizerr/data/creds:/targets/spotizerr
    restart: unless-stopped
    depends_on:
      - arl-dockerproxy
    networks:
      - npm
      - arl-internal

  arl-web:
    image: python:3.15-slim@sha256:ea4f1f290e071bf7d28199cfb3e09f5dbad31b50e9c32fd58f2f2d7be915f3ae
    container_name: arl-web
    working_dir: /app
    command: sh -c "pip install --no-cache-dir requests && python webapp.py"
    environment:
      - TZ=Europe/Amsterdam
      - WEB_PORT=8080
    volumes:
      - ./app:/app:ro
      - ${DOCKER_DATA_DIR}/arl-sentinel/data:/data:ro
    restart: unless-stopped
    depends_on:
      - arl-sentinel
    networks:
      - npm
    labels:
      - homepage.group=Media
      - homepage.name=ARL
      - homepage.icon=deezer.png
      - homepage.href=https://arl.${DOMAIN}/
      - homepage.description=Current Deezer ARL token
      - traefik.enable=true
      - traefik.http.routers.arl.rule=Host(`arl.${DOMAIN}`)
      - traefik.http.routers.arl.entrypoints=websecure,tunnel
      - traefik.http.routers.arl.tls=true
      - traefik.http.services.arl.loadbalancer.server.port=8080

  arl-dockerproxy:
    image: linuxserver/socket-proxy:3.4.7@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5
    container_name: arl-dockerproxy
    environment:
      - CONTAINERS=1
      - POST=0
      - ALLOW_RESTARTS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - arl-internal
    read_only: true
    tmpfs:
      - /run

networks:
  npm:
    external: true
  # No internet or LAN access; only arl-sentinel can reach the socket proxy.
  arl-internal:
    driver: bridge
    internal: true
