# Overrides for scripts/komodo-migrate.py. NAMES ONLY, never values.
#
# By default a key is secret when it references a secret Komodo Variable or its
# name matches pass|pw|secret|token|key|api|auth|... (see SECRET_NAME_RE).
# Entries here win over that guess. Use NAME for every stack, or <stack>/NAME
# for one stack.
#
# secret: moves the key into <stack>/secrets.sops.env
# plain:  keeps the key in komodo/resources/stacks.toml (the repo is public!)
secret:
  - TUNNELID
  - ACCOUNTID
  # JSON / URL values with client secrets or tokens inside
  - SOCIALACCOUNT_PROVIDERS
  - SOCIAL_PROVIDERS
  - APPRISE_CONFIGS_URLS
  - SPOTIFY_CREDS
  # personal email addresses, kept out of the public repo
  - DEEZER_EMAIL
  - LE_EMAIL
  - PODIMO_EMAIL
  - SUPERUSER_EMAIL
plain:
  - AUTHENTIK_ERROR_REPORTING__ENABLED
  - AUTHENTIK_INTERNAL_URL
  - AUTHENTIK_VERSION
  - ENABLE_AUTH
  - GOTIFY_OIDC_SCOPES
  - GOTIFY_OIDC_USERNAMECLAIM
  - JWT_EXPIRATION_HOURS
  - KOMODO_PUBLIC_KEY
