global:
  scrape_interval: 30s

scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets:
          - victoriametrics:8428

  - job_name: vmagent
    static_configs:
      - targets:
          - vmagent:8429

  - job_name: vmalert
    static_configs:
      - targets:
          - vmalert:8880

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  # Add further homelab targets here, e.g.:
  # - job_name: node
  #   static_configs:
  #     - targets:
  #         - node-exporter:9100
  # - job_name: traefik
  #   static_configs:
  #     - targets:
  #         - traefik:8082
