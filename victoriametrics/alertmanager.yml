route:
  receiver: gotify
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: gotify
    webhook_configs:
      - url: http://alertmanager-gotify:8080/gotify_webhook
        send_resolved: true

inhibit_rules:
  # A firing critical alert suppresses the warning for the same alert/instance.
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - job
      - instance
