services:
  # Single-node VictoriaMetrics: TSDB + query API + vmui.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    container_name: victoriametrics
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    command:
      - --storageDataPath=/storage
      - --httpListenAddr=:8428
      - --retentionPeriod=12
      - --vmalert.proxyURL=http://vmalert:8880
    volumes:
      - ${DOCKER_DATA_DIR}/victoriametrics/data:/storage
    labels:
      - homepage.group=Infra
      - homepage.name=VictoriaMetrics
      - homepage.icon=victoriametrics.png
      - homepage.href=https://vmui.${DOMAIN}/
      - homepage.description=Metrics database
      - traefik.enable=true
      - traefik.docker.network=npm
      - traefik.http.routers.vmui.rule=Host(`vmui.${DOMAIN}`)
      - traefik.http.routers.vmui.entrypoints=websecure
      - traefik.http.routers.vmui.tls=true
      - traefik.http.routers.vmui.middlewares=authentik-forwardauth@docker,sec-headers@docker
      - traefik.http.services.vmui.loadbalancer.server.port=8428
    networks:
      - npm

  # Scrapes targets from prometheus.yml, remote-writes into victoriametrics.
  vmagent:
    image: victoriametrics/vmagent:v1.155.0@sha256:8e3c03905be15bba8312d4868e8ae6f9fc2fefee0a41d544472034249ca42bb4
    container_name: vmagent
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    depends_on:
      - victoriametrics
    command:
      - --promscrape.config=/etc/prometheus/prometheus.yml
      - --remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - --remoteWrite.tmpDataPath=/vmagentdata
    volumes:
      - ${DOCKER_DATA_DIR}/victoriametrics/vmagent:/vmagentdata
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=npm
      - traefik.http.routers.vmagent.rule=Host(`vmagent.${DOMAIN}`)
      - traefik.http.routers.vmagent.entrypoints=websecure
      - traefik.http.routers.vmagent.tls=true
      - traefik.http.routers.vmagent.middlewares=authentik-forwardauth@docker,sec-headers@docker
      - traefik.http.services.vmagent.loadbalancer.server.port=8429
    networks:
      - npm
      - victoriametrics-internal

  # Per-container CPU, memory, network and disk I/O metrics.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    container_name: cadvisor
    restart: unless-stopped
    # cAdvisor reads cgroups and /dev/kmsg (OOM events), which needs privileged.
    privileged: true
    devices:
      - /dev/kmsg
    depends_on:
      - victoriametrics-dockerproxy
    command:
      - --docker=tcp://victoriametrics-dockerproxy:2375
      - --docker_only=true
      - --housekeeping_interval=30s
      - --enable_metrics=cpu,diskIO,memory,network,oom_event
      # Only these labels become metric labels; the rest (traefik.*, homepage.*) would blow up cardinality.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /dev/disk:/dev/disk:ro
      # TrueNAS keeps the Docker root dir here instead of /var/lib/docker.
      - /mnt/.ix-apps/docker:/mnt/.ix-apps/docker:ro
    networks:
      - victoriametrics-internal

  # Host CPU, memory, load, filesystem and ZFS metrics.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|mnt/\.ix-apps/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - victoriametrics-internal

  victoriametrics-dockerproxy:
    image: linuxserver/socket-proxy:3.4.7@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5
    container_name: victoriametrics-dockerproxy
    # cAdvisor reads the container list, container details and docker info.
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0 # read-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - victoriametrics-internal
    read_only: true
    tmpfs:
      - /run

  # Evaluates alerting and recording rules from ./rules.
  vmalert:
    image: victoriametrics/vmalert:v1.155.0@sha256:3256cba5ddaca5974eae6141105cec4ce37871f1c213f0a5c267ec0111bc68e1
    container_name: vmalert
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    depends_on:
      - victoriametrics
      - alertmanager
    command:
      - --datasource.url=http://victoriametrics:8428/
      - --remoteRead.url=http://victoriametrics:8428/
      - --remoteWrite.url=http://vmagent:8429/
      - --notifier.url=http://alertmanager:9093/
      - --rule=/etc/alerts/*.yml
      # Makes "Source" links in alerts point at the Grafana stack.
      - --external.url=https://grafana.${DOMAIN}
      - --external.alert.source=explore?orgId=1&left={"datasource":"VictoriaMetrics","queries":[{"expr":{{.Expr|jsonEscape|queryEscape}},"refId":"A"}],"range":{"from":"{{ .ActiveAt.UnixMilli }}","to":"now"}}
    volumes:
      - ./rules:/etc/alerts:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=npm
      - traefik.http.routers.vmalert.rule=Host(`vmalert.${DOMAIN}`)
      - traefik.http.routers.vmalert.entrypoints=websecure
      - traefik.http.routers.vmalert.tls=true
      - traefik.http.routers.vmalert.middlewares=authentik-forwardauth@docker,sec-headers@docker
      - traefik.http.services.vmalert.loadbalancer.server.port=8880
    networks:
      - npm

  # Deduplicates/groups alerts from vmalert and forwards them to the Gotify bridge.
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: alertmanager
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    command:
      - --config.file=/config/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://alertmanager.${DOMAIN}
    volumes:
      - ./alertmanager.yml:/config/alertmanager.yml:ro
      - ${DOCKER_DATA_DIR}/victoriametrics/alertmanager:/alertmanager
    labels:
      - homepage.group=Infra
      - homepage.name=Alertmanager
      - homepage.icon=alertmanager.png
      - homepage.href=https://alertmanager.${DOMAIN}/
      - homepage.description=Alert routing
      - traefik.enable=true
      - traefik.docker.network=npm
      - traefik.http.routers.alertmanager.rule=Host(`alertmanager.${DOMAIN}`)
      - traefik.http.routers.alertmanager.entrypoints=websecure
      - traefik.http.routers.alertmanager.tls=true
      - traefik.http.routers.alertmanager.middlewares=authentik-forwardauth@docker,sec-headers@docker
      - traefik.http.services.alertmanager.loadbalancer.server.port=9093
    networks:
      - npm

  # Translates Alertmanager webhooks into Gotify messages.
  alertmanager-gotify:
    image: druggeri/alertmanager_gotify_bridge:2.3.2@sha256:242441023c6a7956fc7bcdd30350a8fed38f791e703d670aa286fc0465f88b41
    container_name: alertmanager-gotify
    restart: unless-stopped
    environment:
      - GOTIFY_ENDPOINT=http://gotify:80/message
      - GOTIFY_TOKEN=${GOTIFY_VM_TOKEN}
      - TITLE_ANNOTATION=summary
      - MESSAGE_ANNOTATION=description
      - EXTENDED_DETAILS=true
    networks:
      - npm

networks:
  npm:
    external: true
  # No internet or LAN access; only vmagent can reach the exporters and socket proxy.
  victoriametrics-internal:
    driver: bridge
    internal: true
