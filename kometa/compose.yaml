services:
  kometa:
    image: kometateam/kometa:v2.5.3@sha256:48c3cb318ec984213587f221e8e762c5ad2dbd0e6966efc7bba0a5868a6c5758
    environment:
#      - KOMETA_RUN=true
      - TZ=Europe/Amsterdam
      - KOMETA_PLEX_URL=${PLEX_URL}
      - KOMETA_PLEX_TOKEN=${PLEX_TOKEN}
      - KOMETA_TMDB_API_KEY=${TMDB_API_KEY}
      - KOMETA_TRACEARR_URL=${TRACEARR_URL}
      - KOMETA_TRACEARR_API_KEY=${TRACEARR_API_KEY}
      - KOMETA_OMDB_API_KEY=${OMDB_API_KEY}
      - KOMETA_GOTIFY_URL=${GOTIFY_URL}
      - KOMETA_GOTIFY_TOKEN=${GOTIFY_TOKEN}
      - KOMETA_RADARR_URL=${RADARR_URL}
      - KOMETA_RADARR_TOKEN=${RADARR_TOKEN}
      - KOMETA_SONARR_URL=${SONARR_URL}
      - KOMETA_SONARR_TOKEN=${SONARR_TOKEN}
    container_name: kometa
    # Kometa writes back to config.yml, so copy the git-managed file into /config
    # on start instead of mounting it read-only. Keeps a one-time backup of the
    # pre-git config.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -f /config/config.yml ] && cp -n /config/config.yml /config/config.yml.pre-git
        cp /defaults/config.yml /config/config.yml
        exec /tini -s python3 kometa.py --
    volumes:
      - ${DOCKER_DATA_DIR}/kometa/config:/config
      - ./config.yml:/defaults/config.yml:ro
    restart: unless-stopped
    networks:
      - npm
networks:
  npm:
    external: true