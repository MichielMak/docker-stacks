services:
  openchamber:
    image: node:26.13.0-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    container_name: openchamber
    init: true
    environment:
      - TZ=${TZ}
      - LANG=C.UTF-8
      - HOME=/home/node
      # In the repos listed in repos.gitconfig, git and gh act as the michiel-claude[bot] GitHub App; everywhere else
      # they use the user's own identity (~/.gitconfig, gh auth login). See ../paseo/claude-github-app/README.md.
      # The App key and app.env are in ~/.config/claude-github-app/ in the home volume
      - PATH=/opt/claude-github-app/bin:/home/node/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # repos.gitconfig is included from ~/.gitconfig by the command below, not through GIT_CONFIG_* variables:
      # OpenChamber's git library (simple-git) refuses every git command when the environment sets include.path
      - NPM_CONFIG_PREFIX=/home/node/.npm-global
      - OPENCHAMBER_HOST=0.0.0.0
      - OPENCHAMBER_UI_PASSWORD=${OPENCHAMBER_UI_PASSWORD}
      # Versions are pinned below and bumped by Renovate
      - OPENCODE_DISABLE_AUTOUPDATE=1
      # renovate: datasource=npm depName=@openchamber/web
      - OPENCHAMBER_VERSION=2.6.1
      # OpenChamber needs OpenCode 2.x: OpenCode majors wait for approval (renovate.json)
      # renovate: datasource=npm depName=@opencode/cli
      - OPENCODE_VERSION=2.2.5
      - DX_API_TOKEN=${DX_API_TOKEN}
      # CLI tools for agents, the same set as the paseo stack, installed into ~/.npm-global/bin by the command below
      # renovate: datasource=npm depName=@get-dx/cli
      - DX_VERSION=0.10.0
      # renovate: datasource=github-releases depName=cli/cli
      - GH_VERSION=v2.103.3
      # Docker CLI + compose plugin only (no daemon), used to validate compose files
      # renovate: datasource=github-tags depName=docker/cli
      - DOCKER_CLI_VERSION=v29.9.3
      # renovate: datasource=github-releases depName=docker/compose
      - DOCKER_COMPOSE_VERSION=v5.7.0
      # renovate: datasource=github-releases depName=DataDog/pup
      - PUP_VERSION=v2.4.1
      # SOPS binary only, no age private key: agents can encrypt new secrets.sops.env files but not decrypt
      # renovate: datasource=github-releases depName=getsops/sops
      - SOPS_VERSION=v3.13.3
      # uv manages Python: patch releases arrive with uv updates, the minor version is bumped by hand
      # renovate: datasource=github-releases depName=astral-sh/uv
      - UV_VERSION=0.13.7
      - PYTHON_VERSION=3.14
      - UV_PYTHON_BIN_DIR=/home/node/.npm-global/bin
      - UV_TOOL_BIN_DIR=/home/node/.npm-global/bin
      # Atlassian Teamwork Graph CLI, installed from Atlassian's CDN (custom Renovate datasource)
      # renovate: datasource=custom.twg depName=twg
      - TWG_VERSION=1.4.3
    # Upstream publishes no image (their compose builds from source), so OpenChamber, OpenCode and the CLI tools
    # are installed into the persisted home on first start and whenever a version changes
    entrypoint:
      - sh
      - -c
    command:
      - >
        chown node:node /home/node &&
        exec setpriv --reuid=node --regid=node --init-groups sh -c '
          b=/home/node/.npm-global/bin &&
          ( npm ls -g @openchamber/web@$$OPENCHAMBER_VERSION >/dev/null 2>&1 && npm ls -g @opencode/cli@$$OPENCODE_VERSION >/dev/null 2>&1 && npm ls -g @get-dx/cli@$$DX_VERSION >/dev/null 2>&1 ||
            npm install -g --allow-scripts=@opencode/cli,node-pty @openchamber/web@$$OPENCHAMBER_VERSION @opencode/cli@$$OPENCODE_VERSION @get-dx/cli@$$DX_VERSION ) &&
          ( $$b/gh --version 2>/dev/null | grep -qF "gh version $${GH_VERSION#v} " ||
            ( v=$${GH_VERSION#v} && d=gh_$${v}_linux_$$(dpkg --print-architecture) && u=https://github.com/cli/cli/releases/download/$$GH_VERSION && cd /tmp &&
              curl -fsSLO $$u/$$d.tar.gz && curl -fsSL $$u/gh_$${v}_checksums.txt | grep " $$d.tar.gz\$$" | sha256sum -c - && tar -xzf $$d.tar.gz &&
              mv $$d/bin/gh $$b/gh && rm -rf $$d $$d.tar.gz ) ) &&
          ( $$b/docker --version 2>/dev/null | grep -qF " $${DOCKER_CLI_VERSION#v}," ||
            ( curl -fsSL https://download.docker.com/linux/static/stable/$$(uname -m)/docker-$${DOCKER_CLI_VERSION#v}.tgz | tar -xz -C /tmp docker/docker &&
              mv /tmp/docker/docker $$b/docker ) ) &&
          ( /home/node/.docker/cli-plugins/docker-compose version --short 2>/dev/null | grep -qxF "$${DOCKER_COMPOSE_VERSION#v}" ||
            ( f=docker-compose-linux-$$(uname -m) && u=https://github.com/docker/compose/releases/download/$$DOCKER_COMPOSE_VERSION/$$f && cd /tmp &&
              curl -fsSLO $$u && curl -fsSLO $$u.sha256 && sha256sum -c $$f.sha256 && mkdir -p /home/node/.docker/cli-plugins && chmod +x $$f &&
              mv $$f /home/node/.docker/cli-plugins/docker-compose && rm $$f.sha256 ) ) &&
          ( $$b/pup --version 2>/dev/null | grep -qxF "pup $${PUP_VERSION#v}" ||
            ( v=$${PUP_VERSION#v} && f=pup_$${v}_Linux_$$(uname -m | sed s/aarch64/arm64/).tar.gz && u=https://github.com/DataDog/pup/releases/download/$$PUP_VERSION && cd /tmp &&
              curl -fsSLO $$u/$$f && curl -fsSL $$u/pup_$${v}_checksums.txt | grep " $$f\$$" | sha256sum -c - && tar -xzf $$f pup &&
              mv pup $$b/pup && rm $$f ) ) &&
          ( $$b/sops --disable-version-check --version 2>/dev/null | grep -qF "sops $${SOPS_VERSION#v}" ||
            ( f=sops-$$SOPS_VERSION.linux.$$(dpkg --print-architecture) && u=https://github.com/getsops/sops/releases/download/$$SOPS_VERSION && cd /tmp &&
              curl -fsSLO $$u/$$f && curl -fsSL $$u/sops-$$SOPS_VERSION.checksums.txt | grep " $$f\$$" | sha256sum -c - && chmod +x $$f &&
              mv $$f $$b/sops ) ) &&
          ( $$b/uv --version 2>/dev/null | grep -qF "uv $${UV_VERSION} " ||
            ( f=uv-$$(uname -m)-unknown-linux-gnu.tar.gz && u=https://github.com/astral-sh/uv/releases/download/$$UV_VERSION/$$f && cd /tmp &&
              curl -fsSLO $$u && curl -fsSLO $$u.sha256 && sha256sum -c $$f.sha256 && tar -xzf $$f --strip-components=1 -C $$b &&
              rm $$f $$f.sha256 ) ) &&
          $$b/uv python install --default --preview-features python-install-default $$PYTHON_VERSION && $$b/uv python upgrade $$PYTHON_VERSION &&
          ( $$b/twg --version 2>/dev/null | grep -qxF "$$TWG_VERSION" ||
            curl -fsSL --retry 2 https://teamwork-graph.atlassian.com/cli/install | bash -s -- --yes --skip-login --skip-skills --version $$TWG_VERSION --install-dir $$b ) &&
          ( git config --global --get-all include.path | grep -qxF /opt/claude-github-app/repos.gitconfig ||
            git config --global --add include.path /opt/claude-github-app/repos.gitconfig ) &&
          mkdir -p /home/node/workspaces && cd /home/node/workspaces &&
          exec openchamber serve --foreground --port 3000'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    volumes:
      - ${DOCKER_DATA_DIR}/openchamber/home:/home/node
      - ../paseo/claude-github-app:/opt/claude-github-app:ro
    labels:
      - homepage.group=Infra
      - homepage.name=OpenChamber
      - homepage.icon=https://openchamber.dev/favicon.svg
      - homepage.href=https://openchamber.${DOMAIN}/
      - homepage.description=Web UI for the OpenCode coding agent
      - traefik.enable=true
      - traefik.http.routers.openchamber.rule=Host(`openchamber.${DOMAIN}`)
      - traefik.http.routers.openchamber.entrypoints=websecure
      - traefik.http.routers.openchamber.tls=true
      - traefik.http.services.openchamber.loadbalancer.server.port=3000
    restart: unless-stopped
    networks:
      - npm
networks:
  npm:
    external: true
