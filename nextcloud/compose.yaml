services:
  nextcloud:
    image: linuxserver/nextcloud:35.0.2@sha256:e7f790011bf023d33517b4be70231d7aa2e19d54c619664a8533e8bedd4716ac
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - nextclouddb
      - nextcloud-redis
    volumes:
      - ${DOCKER_DATA_DIR}/nextcloud/config:/config
      - ${MEDIA_DIR}/nextcloud:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Amsterdam
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${DB_PW}
      - MYSQL_HOST=nextclouddb
      - REDIS_HOST=nextcloud-redis
    networks:
      - npm
    labels:
      - homepage.group=Media
      - homepage.name=Nextcloud
      - homepage.icon=nextcloud.png
      - homepage.href=http://nextcloud.${DOMAIN}/
      - homepage.description=Open source content collaboration platform
      - homepage.widget.type=nextcloud
      - homepage.widget.fields=["freespace", "numfiles"]
      - homepage.widget.url=https://nextcloud:443
      - homepage.widget.key=${NEXTCLOUD_WIDGET_KEY}
  nextclouddb:
    image: mariadb:12.3.3@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
    container_name: nextclouddb
    command: --transaction-isolation=READ-COMMITTED
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PW}
      - TZ=Europe/Amsterdam
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PW}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${DOCKER_DATA_DIR}/nextclouddb/config/databases:/var/lib/mysql
    restart: unless-stopped
    networks:
      - npm
  nextcloud-redis:
    image: redis:8.10.2-alpine@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
    container_name: nextcloud-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - npm
  eurooffice:
    container_name: eurooffice
    image: ghcr.io/euro-office/documentserver:v9.3.5@sha256:b303064a69d0a4f81ba5945126c4c484fc08bf42436fc97bb85413429e27ba9e
    restart: unless-stopped
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${EUROOFFICE_JWT_SECRET}
      # nextcloud.${DOMAIN} resolves to a LAN IP; without this the server refuses to fetch documents
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - ${DOCKER_DATA_DIR}/eurooffice/data:/var/www/euro-office/Data
      - ${DOCKER_DATA_DIR}/eurooffice/lib:/var/lib/euro-office/documentserver
    networks:
      - npm
    labels:
      - traefik.enable=true
      - traefik.http.routers.eurooffice.rule=Host(`office.${DOMAIN}`)
      - traefik.http.routers.eurooffice.entrypoints=websecure
      - traefik.http.routers.eurooffice.tls=true
      - traefik.http.services.eurooffice.loadbalancer.server.port=80
networks:
  npm:
    external: true