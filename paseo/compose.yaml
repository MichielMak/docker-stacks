services:
  paseo:
    image: ghcr.io/getpaseo/paseo:0.11.1@sha256:664a58a73cac82448b3c72558129534e3be52a18b5f4e801ae446f646bb5d8c1
    container_name: paseo
    environment:
      - TZ=${TZ}
      - PASEO_PASSWORD=${PASEO_PASSWORD}
      - PASEO_HOSTNAMES=paseo.${DOMAIN}
      - PATH=/home/paseo/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DX_API_TOKEN=${DX_API_TOKEN}
      # Docker CLI + compose plugin only (no daemon), used to validate compose files
      # renovate: datasource=github-tags depName=docker/cli
      - DOCKER_CLI_VERSION=v29.8.2
      # renovate: datasource=github-releases depName=docker/compose
      - DOCKER_COMPOSE_VERSION=v5.6.0
      # renovate: datasource=github-releases depName=DataDog/pup
      - PUP_VERSION=v1.26.0
      # SOPS binary only, no age private key: agents can encrypt new secrets.sops.env files but not decrypt
      # renovate: datasource=github-releases depName=getsops/sops
      - SOPS_VERSION=v3.13.3
      # uv manages Python: patch releases arrive with uv updates, the minor version is bumped by hand
      # renovate: datasource=github-releases depName=astral-sh/uv
      - UV_VERSION=0.12.23
      - PYTHON_VERSION=3.14
      - UV_PYTHON_BIN_DIR=/home/paseo/.npm-global/bin
      - UV_TOOL_BIN_DIR=/home/paseo/.npm-global/bin
    entrypoint:
      - /usr/bin/tini
      - --
      - sh
      - -c
    command:
      - >
        mkdir -p /home/paseo/.npm-global && chown -R paseo:paseo /home/paseo/.npm-global && ( [ -x /home/paseo/.npm-global/bin/claude ] ||
          su paseo -s /bin/sh -c 'HOME=/home/paseo npm install -g --prefix /home/paseo/.npm-global @anthropic-ai/claude-code' ) && ( [ -x /home/paseo/.npm-global/bin/copilot ] ||
          su paseo -s /bin/sh -c 'HOME=/home/paseo npm install -g --prefix /home/paseo/.npm-global @github/copilot' ) && ( [ -x /home/paseo/.npm-global/bin/dx ] ||
          su paseo -s /bin/sh -c 'HOME=/home/paseo npm install -g --prefix /home/paseo/.npm-global @get-dx/cli' ) && ( [ -x /home/paseo/.npm-global/bin/gh ] ||
          su paseo -s /bin/sh -c 'v=$$(curl -fsSLI -o /dev/null -w %{url_effective} https://github.com/cli/cli/releases/latest) && v=$${v##*/v} && a=$$(dpkg --print-architecture) &&
            curl -fsSL https://github.com/cli/cli/releases/download/v$$v/gh_$${v}_linux_$$a.tar.gz | tar -xz -C /tmp && mv /tmp/gh_$${v}_linux_$$a/bin/gh /home/paseo/.npm-global/bin/gh' ) && ( /home/paseo/.npm-global/bin/docker --version 2>/dev/null | grep -qF " $${DOCKER_CLI_VERSION#v}," ||
          su paseo -s /bin/sh -c 'curl -fsSL https://download.docker.com/linux/static/stable/$$(uname -m)/docker-$${DOCKER_CLI_VERSION#v}.tgz | tar -xz -C /tmp docker/docker &&
            mv /tmp/docker/docker /home/paseo/.npm-global/bin/docker' ) && ( /home/paseo/.docker/cli-plugins/docker-compose version --short 2>/dev/null | grep -qxF "$${DOCKER_COMPOSE_VERSION#v}" ||
          su paseo -s /bin/sh -c 'f=docker-compose-linux-$$(uname -m) && u=https://github.com/docker/compose/releases/download/$$DOCKER_COMPOSE_VERSION/$$f && cd /tmp &&
            curl -fsSLO $$u && curl -fsSLO $$u.sha256 && sha256sum -c $$f.sha256 && mkdir -p /home/paseo/.docker/cli-plugins && chmod +x $$f &&
            mv $$f /home/paseo/.docker/cli-plugins/docker-compose && rm $$f.sha256' ) && ( /home/paseo/.npm-global/bin/pup --version 2>/dev/null | grep -qxF "pup $${PUP_VERSION#v}" ||
          su paseo -s /bin/sh -c 'v=$${PUP_VERSION#v} && f=pup_$${v}_Linux_$$(uname -m | sed s/aarch64/arm64/).tar.gz && u=https://github.com/DataDog/pup/releases/download/$$PUP_VERSION && cd /tmp &&
            curl -fsSLO $$u/$$f && curl -fsSL $$u/pup_$${v}_checksums.txt | grep " $$f\$$" | sha256sum -c - && tar -xzf $$f pup &&
            mv pup /home/paseo/.npm-global/bin/pup && rm $$f' ) && ( /home/paseo/.npm-global/bin/sops --disable-version-check --version 2>/dev/null | grep -qF "sops $${SOPS_VERSION#v}" ||
          su paseo -s /bin/sh -c 'f=sops-$$SOPS_VERSION.linux.$$(dpkg --print-architecture) && u=https://github.com/getsops/sops/releases/download/$$SOPS_VERSION && cd /tmp &&
            curl -fsSLO $$u/$$f && curl -fsSL $$u/sops-$$SOPS_VERSION.checksums.txt | grep " $$f\$$" | sha256sum -c - && chmod +x $$f &&
            mv $$f /home/paseo/.npm-global/bin/sops' ) && ( /home/paseo/.npm-global/bin/uv --version 2>/dev/null | grep -qF "uv $${UV_VERSION} " ||
          su paseo -s /bin/sh -c 'f=uv-$$(uname -m)-unknown-linux-gnu.tar.gz && u=https://github.com/astral-sh/uv/releases/download/$$UV_VERSION/$$f && cd /tmp &&
            curl -fsSLO $$u && curl -fsSLO $$u.sha256 && sha256sum -c $$f.sha256 && tar -xzf $$f --strip-components=1 -C /home/paseo/.npm-global/bin &&
            rm $$f $$f.sha256' ) && su paseo -s /bin/sh -c 'HOME=/home/paseo /home/paseo/.npm-global/bin/uv python install --default --preview-features python-install-default $$PYTHON_VERSION &&
            HOME=/home/paseo /home/paseo/.npm-global/bin/uv python upgrade $$PYTHON_VERSION' && ( [ -x /home/paseo/.npm-global/bin/twg ] ||
          su paseo -s /bin/bash -c 'export PATH=/home/paseo/.npm-global/bin:$$PATH && curl -fsSL --retry 2 https://teamwork-graph.atlassian.com/cli/install | HOME=/home/paseo bash -s -- --yes --skip-login --skip-skills --install-dir /home/paseo/.npm-global/bin' ) &&
        exec /usr/local/bin/paseo-docker-entrypoint
    volumes:
      - ${DOCKER_DATA_DIR}/paseo/home:/home/paseo
      - paseo-workspace:/workspace
      # Scripts that let Claude sessions act on GitHub as the michiel-claude[bot] App, see the README
      - ./claude-github-app:/opt/claude-github-app:ro
    labels:
      - homepage.group=Infra
      - homepage.name=Paseo
      - homepage.icon=https://paseo.sh/favicon.svg
      - homepage.href=https://paseo.${DOMAIN}/
      - homepage.description=Coding agent daemon and web UI
      - traefik.enable=true
      - traefik.http.routers.paseo.rule=Host(`paseo.${DOMAIN}`)
      - traefik.http.routers.paseo.entrypoints=websecure
      - traefik.http.routers.paseo.tls=true
      - traefik.http.services.paseo.loadbalancer.server.port=6767
    restart: unless-stopped
    networks:
      - npm
volumes:
  paseo-workspace:
    driver: local
networks:
  npm:
    external: true
