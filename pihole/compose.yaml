# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.10.0@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
    environment:
      TZ: Europe/Amsterdam
      FTLCONF_webserver_port: 8080
      # Never forward ${DOMAIN} queries upstream: the wildcard A record only covers A lookups, so
      # HTTPS-type (65) lookups for Cloudflare tunnel hostnames returned Cloudflare's ECH config,
      # and Chrome then failed against Traefik with ERR_ECH_FALLBACK_CERTIFICATE_INVALID.
      # Only settable via pihole.toml or env, not the API, so nebula-sync can't copy it to the replica.
      FTLCONF_misc_dnsmasq_lines: local=/${DOMAIN}/
    volumes:
      - ${DOCKER_DATA_DIR}/pihole/etc-pihole:/etc/pihole
      - ${DOCKER_DATA_DIR}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    networks:
      my-macvlan-net:
        ipv4_address: ${PIHOLE_IP}
      npm: null
    labels:
      - homepage.group=Infra
      - homepage.name=Pihole
      - homepage.icon=pi-hole.png
      - homepage.href=https://pihole.${DOMAIN}/admin
      - homepage.description=DNS sinkhole
      - homepage.widget.type=pihole
      - homepage.widget.url=http://pihole:8080
      - homepage.widget.key=${PIHOLE_API}
      - homepage.widget.version=6
      - traefik.enable=true
      - traefik.docker.network=npm
      - traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)
      - traefik.http.routers.pihole.entrypoints=websecure
      - traefik.http.routers.pihole.tls=true
#      - traefik.http.routers.pihole.tls.certresolver=letsencrypt
      - traefik.http.services.pihole.loadbalancer.server.port=8080
    restart: unless-stopped
networks:
  my-macvlan-net:
    external: true
  npm:
    external: true