services:
  headless-chrome:
    #ports:
    #   - 9222:9222
    container_name: headless-chrome
    # Stable channel: version tags mix stable/beta/dev builds, so track `stable` and let Renovate bump the digest.
    # Pinned digest = 158.0.8127.18.
    image: chromedp/headless-shell:stable@sha256:8c574e39f0db5c1d9efe7c472c6e0fcfc1d91ac0be70eb1dead0f2d52cf104cc
    restart: unless-stopped
    command:
      - --remote-allow-origins=*
    networks:
      - npm
networks:
  npm:
    external: true