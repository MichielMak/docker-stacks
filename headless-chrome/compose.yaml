services:
  headless-chrome:
    #ports:
    #   - 9222:9222
    container_name: headless-chrome
    # Stable channel: version tags mix stable/beta/dev builds, so track `stable` and let Renovate bump the digest.
    # Pinned digest = 158.0.8127.18.
    image: chromedp/headless-shell:stable@sha256:5bb2432d550896f4cb4266c367c48d82e6e2ed61f71ced68687bb175d62ce312
    restart: unless-stopped
    command:
      - --remote-allow-origins=*
    networks:
      - npm
networks:
  npm:
    external: true