repos:
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.249.7
    hooks:
      - id: renovate-config-validator
        args: [--strict]
        files: "(^|/)renovate\\.json5?$"
        verbose: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Traefik dynamic configs are Go templates ({{ env "X" }}), not valid YAML
        exclude: "^traefik/dynamic/"
  - repo: local
    hooks:
      - id: docker-compose-config
        name: Validate docker compose files
        entry: bash -c 'for f in "$@"; do docker compose -f "$f" config --no-interpolate --quiet || exit 1; done' --
        language: system
        files: "(^|/)compose\\.ya?ml$"
        verbose: true
      - id: sops-encrypted
        name: SOPS files must be encrypted
        entry: bash -c 'rc=0; for f in "$@"; do grep -q "^sops_mac=" "$f" || { echo "$f is not SOPS-encrypted (no sops_mac= line). Edit it with sops $f"; rc=1; }; done; exit $rc' --
        language: system
        files: "\\.sops\\.env$"
      - id: no-plaintext-secrets
        name: No plaintext secret or age key files
        entry: "Plaintext secrets/keys must not be committed. Put stack secrets in <stack>/secrets.sops.env (sops-encrypted)."
        language: fail
        files: "(^|/)secrets\\.env$|\\.agekey$"
