repos:
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.227.4
    hooks:
      - id: renovate-config-validator
        # --no-global: check the files as repository config (with file
        # arguments the validator otherwise treats them as global config)
        args: [--strict, --no-global]
        files: "(^|/)renovate\\.json5?$"
        verbose: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Traefik dynamic configs are Go templates ({{ env "X" }}), not valid YAML
        exclude: "^traefik/dynamic/"
  # GitHub Actions workflows: actionlint catches syntax, expression and shell
  # (shellcheck) errors; zizmor catches security problems such as unpinned
  # actions, template injection and persisted credentials.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
  - repo: local
    hooks:
      - id: docker-compose-config
        name: Validate docker compose files
        entry: bash -c 'for f in "$@"; do docker compose -f "$f" config --no-interpolate --quiet || exit 1; done' --
        language: system
        files: "(^|/)compose\\.ya?ml$"
        verbose: true
      - id: sops-encrypted
        name: SOPS files must be encrypted
        entry: bash -c 'rc=0; for f in "$@"; do grep -q "^sops_mac=" "$f" || { echo "$f is not SOPS-encrypted (no sops_mac= line). Edit it with sops $f"; rc=1; }; done; exit $rc' --
        language: system
        files: "\\.sops\\.env$"
      - id: no-plaintext-secrets
        name: No plaintext secret or age key files
        entry: "Plaintext secrets/keys must not be committed. Put stack secrets in <stack>/secrets.sops.env (sops-encrypted)."
        language: fail
        files: "(^|/)secrets\\.env$|\\.agekey$"
