# Tunnel traffic must use the tunnel entrypoint (:8443). Anything from the tunnel
# network (see traefik/compose.yaml) that reaches websecure gets a 403, so a changed
# tunnel config can't reach internal routers through traefik:443.
http:
  routers:
    tunnel-deny:
      rule: "ClientIP(`10.250.250.0/28`)"
      entryPoints:
        - websecure
      priority: 100000
      tls: {}
      middlewares:
        - deny-all
      service: noop@internal

  middlewares:
    deny-all:
      ipAllowList:
        sourceRange:
          - 127.0.0.1/32
