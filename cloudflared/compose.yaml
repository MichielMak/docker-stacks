services:
  cloudflared:
    container_name: cloudflared
    # The tunnel token comes from TUNNEL_TOKEN (secrets.sops.env), not from the
    # command line, so cloudflared never prints it in its logs.
    command: tunnel --no-autoupdate run
    environment:
      - TZ=Europe/Amsterdam
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    # Only Traefik's tunnel entrypoint and the Komodo webhook listener are reachable
    # (tunnel network); default is for the outbound connection to Cloudflare.
    networks:
      - tunnel
      - default
    restart: unless-stopped
    image: cloudflare/cloudflared:2026.10.6@sha256:004d843fa5fdc3103983fd580ee19fab4a8fa98add31f87249c1659e848c98e0
    labels:
      - homepage.group=Infra
      - homepage.name=Cloudflared
      - homepage.icon=cloudflare.png
      - homepage.description=Tunnel to Cloudflare for public access
      - homepage.widget.type=cloudflared
      - homepage.widget.accountid=${ACCOUNTID}
      - homepage.widget.tunnelid=${TUNNELID}
      - homepage.widget.key=${CLOUDFLAREAPITOKEN}
networks:
  # Created by the traefik stack.
  tunnel:
    external: true
