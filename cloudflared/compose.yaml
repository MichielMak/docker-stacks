services:
  cloudflared:
    container_name: cloudflared
    # The tunnel token comes from TUNNEL_TOKEN (secrets.sops.env), not from the
    # command line, so cloudflared never prints it in its logs.
    command: tunnel --no-autoupdate run
    environment:
      - TZ=Europe/Amsterdam
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - npm
    restart: unless-stopped
    image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    labels:
      - homepage.group=Infra
      - homepage.name=Cloudflared
      - homepage.icon=cloudflare.png
      - homepage.description=Tunnel to Cloudflare for public access
      - homepage.widget.type=cloudflared
      - homepage.widget.accountid=${ACCOUNTID}
      - homepage.widget.tunnelid=${TUNNELID}
      - homepage.widget.key=${CLOUDFLAREAPITOKEN}
networks:
  npm:
    external: true
