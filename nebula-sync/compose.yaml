services:
  nebula-sync:
    image: docker.io/lovelaze/nebula-sync:v0.11.3@sha256:59c51378460f6dc8707cc91a16aa62dff5cd5dd8b39353658b45cb00d6bfddd8
    container_name: nebula-sync
    environment:
      - PRIMARY=http://pihole:8080|${PIHOLE_PW}
      - REPLICAS=${PIHOLE_IP}|${PIHOLE_PW}
      - FULL_SYNC=true
      - RUN_GRAVITY=true
      - SYNC_CONFIG_DNS=true
      - SYNC_CONFIG_DNS_EXCLUDE=listeningMode
      - CRON=0 * * * *
    restart: unless-stopped
    networks:
      - npm
networks:
  npm:
    external: true