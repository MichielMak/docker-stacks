name: openchamber-6505-watch
enabled: true
on:
  # Hub's GitHub triggers only see repos the App is installed on, so poll the upstream repo daily.
  schedule.tick:
    recurrence:
      start: "2026-11-08T09:00:00"
      rule: "FREQ=DAILY"
      timezone: Europe/Amsterdam
run:
  target:
    daemon: ba650f671649
    cwd: /home/paseo/workspace/docker-stacks
  agent:
    provider: claude
    # A classifier reviews tool calls instead of skipping all checks: this run is read-only.
    mode: auto
  continuation:
    mode: new
  title: "OpenChamber #6505 watch ${{ paseo.execution.id }}"
  prompt: |
    Daily watch for openchamber/openchamber#6505. This run is READ-ONLY: never edit files, never run
    git, never create, comment on or change anything on GitHub, and never restart anything.

    Background: OpenCode is held at 2.2.5 in openchamber/compose.yaml and renovate.json, because
    OpenCode 2.2.6 makes OpenChamber's proxied API calls fail with 403. The fix is upstream PR
    openchamber/openchamber#6508.

    Check with curl against the public APIs (no token needed):
    1. Issue #6505 and PR #6508 state:
       https://api.github.com/repos/openchamber/openchamber/issues/6505
       https://api.github.com/repos/openchamber/openchamber/pulls/6508
    2. If #6508 is merged: the latest OpenChamber release (GitHub releases API) and the latest
       @openchamber/web version on npm (https://registry.npmjs.org/@openchamber/web/latest).
       Decide whether that release includes the merge commit, for example with
       https://api.github.com/repos/openchamber/openchamber/compare/<merge_commit_sha>...<release_tag>
       (status "ahead" or "identical" means the release includes it).

    Send a Gotify message with curl ONLY when something changed that needs action. Never print the token:
    - #6508 merged and included in a published @openchamber/web release:
      title "OpenChamber #6505 fixed in <version>", priority 5, message: lift the OpenCode 2.2.5
      hold (renovate.json rule and openchamber/compose.yaml comment), then disable the
      openchamber-6505-watch trigger in the Hub UI.
    - #6508 closed without merging, or #6505 closed as not planned:
      title "OpenChamber #6505: fix PR closed", priority 5, with a one-line summary.

      curl -fsS -X POST "$GOTIFY_URL/message?token=$GOTIFY_HEALTH_TOKEN" \
        -F "title=<title>" -F "message=<message>" -F "priority=<priority>"

    If nothing needs action (PR still open, or merged but not released yet), send nothing.
    If a check fails, send a priority 2 Gotify message saying which check failed.
    Put the findings in finish_execution.
  max_runtime: 15m
  idle_timeout: 5m
  auto_archive: true
