name: mcp-tools-test
enabled: true
on:
  manual.run: {}
run:
  target:
    daemon: ba650f671649
    cwd: /home/paseo/workspace/docker-stacks
  agent:
    provider: claude
    mode: bypassPermissions
  continuation:
    mode: new
  title: Hub MCP tools test
  prompt: |
    Diagnostic run. Do not change any files and do not run git or gh.

    1. List every MCP server and tool you can call, grouped by server (names only).
    2. Say whether these are available: TrueNAS (mcpjungle__Truenas__*), Docker
       (mcpjungle__TrueNAS_Docker__*) and Home Assistant (mcpjungle__hass__*).
    3. Report whether the environment variables GOTIFY_URL and GOTIFY_HEALTH_TOKEN are set,
       by name only. Never print their values.

    Finish with finish_execution and put the report in it.
  max_runtime: 15m
  idle_timeout: 5m
  auto_archive: true
