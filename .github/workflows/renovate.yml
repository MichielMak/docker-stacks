name: Renovate

on:
  schedule:
    # Hourly at :20, offset from other scheduled workflows. GitHub skips many
    # scheduled runs, so in practice this fires every 4-7 hours.
    - cron: "20 * * * *"
  # Run again as soon as CI finishes on a Renovate PR. Renovate merges about
  # one PR per run (the merge moves main, so the other PRs are rebased and
  # their CI runs again), so this keeps merges going through the night
  # automerge window instead of waiting for the next scheduled run.
  # Renovate never checks out PR code here; it only reads its config from main.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Pre-commit
      - Trivy Security Scan
    types: [completed]
    branches:
      - "renovate/**"
  workflow_dispatch:
    inputs:
      repoCache:
        description: "Repository cache behaviour"
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
      logLevel:
        description: "Renovate log level"
        type: choice
        default: info
        options:
          - info
          - debug

permissions:
  contents: read

env:
  # Directory Renovate itself uses for its caches. Caching this exact path
  # avoids the permission problems that come with overriding `cacheDir`. It
  # holds both the repository cache (`repository/`) and the package cache
  # (`renovate-cache-v1/`); the package cache lets Docker Hub tag lookups stop
  # after the first page instead of hitting the Hub rate limit every run.
  cache_dir: /tmp/renovate/cache/renovate
  # Bump this value manually to invalidate every existing cache entry.
  cache_key: renovate-cache
  # Repositories this Renovate instance manages. Both lists must be kept in
  # sync: the token step wants names relative to the owner, while Renovate
  # itself wants fully qualified names.
  renovate_repos: |
    docker-stacks
    open_agb_firm
    flightscanner
  renovate_repositories: MichielMak/docker-stacks,MichielMak/open_agb_firm,MichielMak/flightscanner

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    # workflow_run: only for green CI on branches in this repo (not forks
    # that happen to use a renovate/ branch name).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exchanges the GitHub App private key for a short-lived installation
      # token. This replaces the self-hosted token-generator container.
      # The token keeps all of the App's permissions on purpose: Renovate uses
      # most of them (contents, pull requests, issues, workflows, checks,
      # statuses, Dependabot alerts, packages). It is limited to the
      # repositories in `renovate_repos`.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.renovate_repos }}

      # The primary key contains the run id and attempt so every run stores a
      # fresh entry; `restore-keys` then picks the most recent previous entry.
      - name: Restore Renovate cache
        id: cache-restore
        if: inputs.repoCache != 'disabled' && inputs.repoCache != 'reset'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-

      # The restored files belong to the runner user, but Renovate reads them
      # from inside its container as uid 12021.
      - name: Fix restored cache ownership
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: sudo chown -R 12021:0 /tmp/renovate/

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.225.0
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ env.renovate_repositories }}
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}
          # Authenticated Docker Hub pulls avoid the low anonymous rate limit,
          # which matters because this repo tracks 60+ images.
          RENOVATE_HOST_RULES: >-
            [
              {
                "matchHost": "docker.io",
                "hostType": "docker",
                "username": "${{ secrets.DOCKERHUB_USERNAME }}",
                "password": "${{ secrets.DOCKERHUB_TOKEN }}"
              },
              {
                "matchHost": "ghcr.io",
                "hostType": "docker",
                "username": "x-access-token",
                "password": "${{ steps.app-token.outputs.token }}"
              }
            ]

      - name: Save Renovate cache
        if: inputs.repoCache != 'disabled' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
