name: Authentik

# Plans authentik/terraform/ on pull requests and applies it on main.
# This repo is public, so the job logs are too: keep sensitive values in
# `sensitive = true` variables so OpenTofu redacts them.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "authentik/terraform/**"
      - ".github/workflows/authentik.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=opentofu/opentofu
  TOFU_VERSION: 1.13.9
  AUTHENTIK_URL: https://auth.makstra.nl
  AUTHENTIK_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # Pull requests run this workflow every time, so "Authentik OpenTofu" always reports and can be a
  # required check. This job decides whether there is anything to plan.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      tofu: ${{ steps.diff.outputs.tofu }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # push is already path-filtered; schedule and workflow_dispatch always run.
          if [ "$EVENT" != pull_request ]; then
            echo "tofu=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '^(authentik/terraform/|\.github/workflows/authentik\.yml$)'; then
            echo "tofu=true" >> "$GITHUB_OUTPUT"
          else
            echo "tofu=false" >> "$GITHUB_OUTPUT"
          fi

  tofu:
    # Static name: this is the required check. A skipped job counts as passing.
    name: Authentik OpenTofu
    needs: changes
    # Fork PRs get no secrets.
    if: needs.changes.outputs.tofu == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: authentik-tofu
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authentik/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -diff

      - name: Init
        run: tofu init -backend-config="endpoints={s3=\"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"

      - name: Validate
        run: tofu validate

      - name: Plan
        run: tofu plan -lock-timeout=5m -out=tfplan

      - name: Apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tofu apply -lock-timeout=5m tfplan
