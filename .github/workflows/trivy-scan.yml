name: Trivy Security Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-scan:
    name: Config scan (compose misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Trivy config scan
        id: scan
        run: |
          set -euo pipefail

          # komodo/periphery.Dockerfile is skipped: periphery must run as root
          # to manage the Docker socket, so DS-0002 (non-root USER) can't be fixed.
          set +e
          trivy config . \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --skip-files komodo/periphery.Dockerfile \
            --exit-code 1 \
            --format table > config_report.txt 2>&1
          code=$?
          set -e

          cat config_report.txt

          if [ "$code" -ne 0 ]; then
            {
              echo "## 🛡️ Trivy config scan — HIGH/CRITICAL misconfigurations found"
              echo
              echo "The following misconfigurations must be resolved before merging."
              echo
              echo '```'
              cat config_report.txt
              echo '```'
            } > config_comment.md
            if [ "$(wc -c < config_comment.md)" -gt 60000 ]; then
              run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              head -c 60000 config_comment.md > config_comment.trunc
              printf '\n\n_Comment truncated. See the [Actions log](%s) for full details._\n' "$run_url" >> config_comment.trunc
              mv config_comment.trunc config_comment.md
            fi
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post findings comment
        if: >-
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          steps.scan.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-config-scan
          path: config_comment.md

      - name: Clear stale comment
        if: >-
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          steps.scan.outputs.found == 'false'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-config-scan
          delete: true

      - name: Fail if misconfigurations found
        if: steps.scan.outputs.found == 'true'
        run: exit 1

  image-scan:
    name: Image scan (changed stacks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      # dhi.io (Docker Hardened Images) needs a login even to read manifests.
      # Trivy picks the credential per registry from the Docker config.
      - name: Log in to dhi.io
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "No Docker Hub token available (fork PR?); skipping dhi.io login."
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login dhi.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Determine changed compose files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          git fetch --quiet origin "${BASE_REF}" || true
          files=$(git diff --name-only "$base"...HEAD -- \
            '**/compose.yaml' '**/compose.yml' \
            '**/docker-compose.yaml' '**/docker-compose.yml' || true)
          printf '%s\n' "$files" | sed '/^$/d' > changed_files.txt
          echo "Changed compose files:"
          cat changed_files.txt || true

      - name: Extract and scan images
        id: scan
        run: |
          set -euo pipefail

          if [ ! -s changed_files.txt ]; then
            echo "No changed compose files detected. Nothing to scan."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract every `image:` reference from the changed compose files,
          # strip quotes/whitespace, and de-duplicate.
          mapfile -t changed_files < changed_files.txt
          images=$(grep -hoE '^[[:space:]]*image:[[:space:]]*\S+' "${changed_files[@]}" \
            | sed -E 's/^[[:space:]]*image:[[:space:]]*//; s/["'\'']//g' \
            | tr -d '\r' \
            | sort -u || true)

          if [ -z "$images" ]; then
            echo "No image references found in changed compose files."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Images to scan:"
          echo "$images"

          : > image_comment.md
          : > image_errors.md
          fail=0
          scan_error=0
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for img in $images; do
            echo "::group::Scanning $img"
            # --ignore-unfixed: only report vulnerabilities that have a fix
            #   available (actionable — Renovate can bump to the patched image).
            # --exit-code 2: findings return 2, keeping them apart from Trivy's
            #   exit code 1, which means the scan itself failed (for example an
            #   image or digest that does not exist).
            json="$(mktemp)"
            set +e
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --no-progress \
              --timeout 15m \
              --exit-code 2 \
              --format json \
              --output "$json" \
              "$img"
            code=$?
            set -e

            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
              echo "::error::Scan failed for $img (exit $code)"
              echo "- \`$img\` (exit $code)" >> image_errors.md
              scan_error=1
              rm -f "$json"
              echo "::endgroup::"
              continue
            fi

            # Human-readable table in the job log (full detail lives here).
            trivy convert --format table "$json" || cat "$json"

            if [ "$code" -eq 2 ]; then
              echo "::warning::Vulnerabilities found in $img"
              crit=$(jq '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + "|" + .PkgName) | map(select(.Severity == "CRITICAL")) | length' "$json")
              high=$(jq '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + "|" + .PkgName) | map(select(.Severity == "HIGH")) | length' "$json")
              total=$(jq '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + "|" + .PkgName) | length' "$json")
              {
                echo "### \`$img\`"
                echo
                echo "**${crit} CRITICAL, ${high} HIGH** fixable vulnerabilities"
                echo
                echo "| CVE | Package | Installed | Fixed | Severity |"
                echo "| --- | --- | --- | --- | --- |"
                jq -r '
                  [.Results[]?.Vulnerabilities[]?]
                  | unique_by(.VulnerabilityID + "|" + .PkgName)
                  | sort_by(if .Severity == "CRITICAL" then 0 else 1 end)
                  | .[:30][]
                  | "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \(.Severity) |"
                ' "$json"
                if [ "$total" -gt 30 ]; then
                  echo
                  echo "_…and $((total - 30)) more. See the [Actions log]($run_url) for the full report._"
                fi
                echo
              } >> image_comment.md
              fail=1
            fi
            rm -f "$json"
            echo "::endgroup::"
          done

          if [ "$fail" -ne 0 ] || [ "$scan_error" -ne 0 ]; then
            {
              if [ "$scan_error" -ne 0 ]; then
                echo "## ❌ Trivy image scan — some images could not be scanned"
                echo
                echo "These images could not be pulled or scanned. Check that the tag and digest exist. This blocks merging."
                echo
                cat image_errors.md
                echo
              fi
              if [ "$fail" -ne 0 ]; then
                echo "## 🛡️ Trivy image scan — fixable HIGH/CRITICAL vulnerabilities found"
                echo
                echo "For information only: these findings do not block merging. Many are already deployed; the weekly scheduled scan tracks them."
                echo
                cat image_comment.md
              fi
            } > image_comment_final.md
            mv image_comment_final.md image_comment.md

            # Safety net: keep the comment under GitHub's 65536-char limit.
            if [ "$(wc -c < image_comment.md)" -gt 60000 ]; then
              head -c 60000 image_comment.md > image_comment.trunc
              printf '\n\n_Comment truncated. See the [Actions log](%s) for full details._\n' "$run_url" >> image_comment.trunc
              mv image_comment.trunc image_comment.md
            fi

            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          echo "scan_error=$([ "$scan_error" -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Post findings comment
        if: >-
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          steps.scan.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-image-scan
          path: image_comment.md

      - name: Clear stale comment
        if: >-
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          steps.scan.outputs.found == 'false'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-image-scan
          delete: true

      # Vulnerabilities are reported only (see the comment above); fail only
      # when an image could not be scanned at all.
      - name: Fail if an image could not be scanned
        if: steps.scan.outputs.scan_error == 'true'
        run: exit 1
