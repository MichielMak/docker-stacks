name: Cloudflare

# Plans cloudflare/ on pull requests and applies it on main, and daily so the
# GitHub webhook ranges in waf.tf stay current.
# This repo is public, so the job logs are too: keep sensitive values in
# `sensitive = true` variables so OpenTofu redacts them.

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-tofu
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=opentofu/opentofu
  TOFU_VERSION: 1.13.2
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_tunnel_id: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
  TF_VAR_access_guest_emails: ${{ secrets.ACCESS_GUEST_EMAILS }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  tofu:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    # Fork PRs get no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -diff

      - name: Init
        run: tofu init -backend-config='endpoints={s3="https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"}'

      - name: Validate
        run: tofu validate

      - name: Plan
        run: tofu plan -lock-timeout=5m -out=tfplan

      - name: Apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tofu apply -lock-timeout=5m tfplan
