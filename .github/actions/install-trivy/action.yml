name: Install Trivy
description: >-
  Install Trivy from its GitHub release and check it against the release's
  SHA-256 checksums. Stands in for aquasecurity/setup-trivy, whose install
  script downloads from get.trivy.dev, which no longer resolves
  (https://github.com/aquasecurity/setup-trivy/issues/42). Switch back to
  setup-trivy once that is fixed upstream.

inputs:
  version:
    description: Trivy version to install, such as v0.76.1
    required: true

runs:
  using: composite
  steps:
    - name: Download and verify Trivy
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64) arch=64bit ;;
          aarch64 | arm64) arch=ARM64 ;;
          *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
        esac

        v="${VERSION#v}"
        base="https://github.com/aquasecurity/trivy/releases/download/v${v}"
        tgz="trivy_${v}_Linux-${arch}.tar.gz"
        sums="trivy_${v}_checksums.txt"

        dir="$RUNNER_TEMP/trivy"
        mkdir -p "$dir/bin"
        cd "$dir"

        curl -fsSL --retry 3 -o "$tgz" "${base}/${tgz}"
        curl -fsSL --retry 3 -o "$sums" "${base}/${sums}"

        # Fail if the archive is not listed or its checksum does not match.
        grep -E "  ${tgz}\$" "$sums" > expected.sha256
        sha256sum -c expected.sha256

        tar -xzf "$tgz" -C bin trivy
        echo "$dir/bin" >> "$GITHUB_PATH"

    - name: Show Trivy version
      shell: bash
      run: trivy --version
