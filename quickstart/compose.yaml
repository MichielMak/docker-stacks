# Kometa Quickstart: a web UI that walks you through building a Kometa
# (formerly Plex Meta Manager) config.yml. Config is stored in
# ${DOCKER_DATA_DIR}/quickstart/config. No Traefik labels or published port,
# so it is only reachable on the npm network.
services:
  quickstart:
    image: kometateam/quickstart:v0.10.14@sha256:3b738f5ca494ec098bfe90cf6899968e60a824b85cf35d43302a18f301d31640
    container_name: quickstart
#    ports:
#      - 7171:7171
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ${DOCKER_DATA_DIR}/quickstart/config:/config
    restart: unless-stopped
    networks:
      - npm
networks:
  npm:
    external: true