services:
  quickstart:
    image: kometateam/quickstart:v0.10.12@sha256:edb5319f7a4884c62fb175dd4f1c210bbc95d8c86b2a48291d05e231ffa90cc5
    container_name: quickstart
#    ports:
#      - 7171:7171
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ${DOCKER_DATA_DIR}/quickstart/config:/config
    restart: unless-stopped
    networks:
      - npm
networks:
  npm:
    external: true