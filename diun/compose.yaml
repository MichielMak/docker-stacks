services:
  diun:
    image: crazymax/diun:4.33.1@sha256:8cc638b4c54e8a0c47898a51b20dae73037ad43310168b5da543a311dc668f77
    container_name: diun
    command: serve
    volumes:
      - ${DOCKER_DATA_DIR}/diun/config:/data
    environment:
      - TZ=Europe/Amsterdam
      - DIUN_PROVIDERS_DOCKER_ENDPOINT=tcp://diun-dockerproxy:2375
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=false
      - DIUN_NOTIF_GOTIFY_ENDPOINT=${ENDPOINT}
      - DIUN_NOTIF_GOTIFY_TOKEN=${TOKEN}
    restart: unless-stopped
    depends_on:
      - diun-dockerproxy
    networks:
      - npm
      - diun-internal

  diun-dockerproxy:
    image: linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    container_name: diun-dockerproxy
    # Diun reads containers and their image digests.
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=0 # read-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - diun-internal
    read_only: true
    tmpfs:
      - /run

networks:
  npm:
    external: true
  # No internet or LAN access; only diun can reach the socket proxy.
  diun-internal:
    driver: bridge
    internal: true
