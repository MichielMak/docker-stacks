services:
  diun:
    image: crazymax/diun:4.34.0@sha256:f350e8e7cc0e3b33d500e2fc462ac9273d8954327f32e2501b34b6bef5a0de3e
    container_name: diun
    command: serve
    volumes:
      - ${DOCKER_DATA_DIR}/diun/config:/data
    environment:
      - TZ=Europe/Amsterdam
      - DIUN_PROVIDERS_DOCKER_ENDPOINT=tcp://diun-dockerproxy:2375
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=false
      - DIUN_NOTIF_GOTIFY_ENDPOINT=${ENDPOINT}
      - DIUN_NOTIF_GOTIFY_TOKEN=${TOKEN}
    restart: unless-stopped
    depends_on:
      - diun-dockerproxy
    networks:
      - npm
      - diun-internal

  diun-dockerproxy:
    image: linuxserver/socket-proxy:3.4.8@sha256:6beb1743581ec3b2ed1a2bafd617e8c7a1d7ae2fe835293e333327618fc2b925
    container_name: diun-dockerproxy
    # Diun reads containers and their image digests.
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=0 # read-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - diun-internal
    read_only: true
    tmpfs:
      - /run

networks:
  npm:
    external: true
  # No internet or LAN access; only diun can reach the socket proxy.
  diun-internal:
    driver: bridge
    internal: true
