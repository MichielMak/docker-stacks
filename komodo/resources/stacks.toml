# Generated by scripts/komodo-migrate.py --write-toml.
# No secret values: stack secrets are in <stack>/secrets.sops.env,
# other secrets are [[KOMODO_...]] refs to secret Komodo Variables.

[[stack]]
name = "arl-sentinel"

[stack.config]
server = "Local"
linked_repo = "docker-stacks"
run_directory = "arl-sentinel"
environment = """
DOCKER_DATA_DIR=[[DOCKER_DATA_DIR]]
DOMAIN=[[DOMAIN]]
"""
compose_cmd_wrapper = "sops exec-env secrets.sops.env '[[COMPOSE_COMMAND]]'"
compose_cmd_wrapper_include = ["up", "pull", "build", "run"]

