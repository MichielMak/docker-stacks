# Komodo Resource Sync for komodo/resources/ (docs/plans/komodo-iac-sops.md, Phase 4).
# This file is inside resource_path, so the sync manages itself.
# Written by hand: scripts/komodo-migrate.py --write-toml leaves it alone.

[[resource_sync]]
name = "docker-stacks"

[resource_sync.config]
linked_repo = "docker-stacks"
resource_path = ["komodo/resources"]
# UI edits are not committed back to git.
managed = false
# Never delete resources that are missing from the TOML. Keep this false while:
# - `stash` isn't in the TOML (its files live only on the host), and
# - include_variables is true: secret Variables (like KOMODO_ALERTER_GOTIFY_URL)
#   aren't in variables.toml, so delete = true would remove them.
delete = false
include_resources = true
# variables.toml holds the plain Variables. Secret Variables stay in Komodo's DB.
include_variables = true
include_user_groups = false
