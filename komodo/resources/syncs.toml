# Komodo Resource Sync for komodo/resources/ (docs/plans/komodo-iac-sops.md, Phase 4).
# Create it once in the Komodo UI with these settings. Once resource_path covers
# this file, the sync manages itself.
#
# Canary: only stacks.toml is synced, and it holds just the canary stack.
# The rollout widens resource_path to ["komodo/resources"].

[[resource_sync]]
name = "docker-stacks"

[resource_sync.config]
linked_repo = "docker-stacks"
resource_path = ["komodo/resources/stacks.toml"]
# UI edits are not committed back to git.
managed = false
# Never delete resources that are missing from the TOML. Flip only after a clean diff.
delete = false
include_resources = true
# Canary: variables.toml isn't synced yet.
include_variables = false
include_user_groups = false
